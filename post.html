<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article — Chronicle</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Reading Progress Indicator -->
  <div class="reading-progress-container">
    <div id="reading-progress-bar" class="reading-progress-bar"></div>
  </div>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="site-logo">
        <span class="logo-badge">C</span>
        <span>Chronicle</span>
      </a>

      <nav id="nav-menu" class="nav-menu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="index.html#articles" class="nav-link">Articles</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="contact.html" class="nav-link">Contact</a>
        <a href="admin.html" class="nav-link" style="color: var(--accent); font-weight: 600;">Admin Studio</a>
      </nav>

      <div class="header-actions">
        <button id="theme-toggle" class="icon-btn" title="Toggle light/dark theme" aria-label="Toggle theme">
          <span class="theme-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </span>
        </button>

        <button id="mobile-menu-btn" class="icon-btn mobile-menu-toggle" aria-label="Toggle mobile navigation">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- Article Header & Breadcrumbs -->
    <section class="post-header-section">
      <div class="container">
        <div class="breadcrumbs">
          <a href="index.html">Home</a>
          <span>/</span>
          <span id="breadcrumb-category">Category</span>
          <span>/</span>
          <span id="breadcrumb-title" style="color: var(--text-primary); font-weight: 500;">Title</span>
        </div>

        <span id="post-category" class="category-badge">Category</span>
        <h1 id="post-title" class="post-full-title">Article Title</h1>

        <div class="post-meta post-meta-centered">
          <img id="post-author-avatar" class="author-avatar" src="" alt="" />
          <div class="author-info">
            <span id="post-author-name" class="author-name">Author Name</span>
            <div class="meta-details">
              <span id="post-date">Date</span>
              <span class="meta-dot">•</span>
              <span id="post-read-time">Read time</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Cover Image -->
    <div class="container post-cover-wrap">
      <img id="post-cover-img" class="post-cover-img" src="" alt="Cover Image" />
      <p id="post-cover-caption" class="cover-caption"></p>
    </div>

    <!-- Article Content Layout -->
    <div class="container post-body-layout">
      <!-- Sticky Navigation & Share Stack -->
      <aside class="post-sidebar-sticky">
        <!-- Table of Contents -->
        <div class="toc-card">
          <h4 class="toc-title">In This Article</h4>
          <ul id="toc-list" class="toc-list">
            <!-- Dynamically populated from h2 headings -->
          </ul>
        </div>

        <!-- Share Actions -->
        <div class="share-stack">
          <button id="share-twitter-btn" class="share-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"></path>
            </svg>
            <span>Share to X</span>
          </button>
          <button id="share-linkedin-btn" class="share-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
              <rect x="2" y="9" width="4" height="12"></rect>
              <circle cx="4" cy="4" r="2"></circle>
            </svg>
            <span>Share to LinkedIn</span>
          </button>
          <button id="share-copy-btn" class="share-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span>Copy Link</span>
          </button>
        </div>
      </aside>

      <!-- Main Prose & Comments Column -->
      <article class="article-column">
        <!-- Content injected from post data -->
        <div id="article-content" class="article-prose"></div>

        <!-- Tags Row -->
        <div id="post-tags-row" class="post-tags-row"></div>

        <!-- Author Biography Card -->
        <div class="author-bio-box">
          <img id="bio-author-avatar" class="author-bio-avatar" src="" alt="Author" />
          <div class="author-bio-info">
            <h4 id="bio-author-name"></h4>
            <div id="bio-author-role" class="author-bio-role"></div>
            <p id="bio-author-desc" class="author-bio-desc"></p>
          </div>
        </div>

        <!-- Interactive Comments -->
        <section class="comments-section" id="comments">
          <div class="comments-header">
            <h3 class="section-title">Discussion <span id="comments-count"></span></h3>
          </div>

          <!-- Existing Comments List -->
          <div id="comments-list" class="comments-list"></div>

          <!-- Add Comment Form -->
          <form id="comment-form" class="comment-form">
            <h4 class="form-title">Join the Conversation</h4>
            <div class="form-group">
              <label for="comment-name" class="form-label">Your Name</label>
              <input type="text" id="comment-name" class="form-input" placeholder="e.g. Maya Lin" required />
            </div>
            <div class="form-group">
              <label for="comment-text" class="form-label">Your Message</label>
              <textarea id="comment-text" class="form-textarea" placeholder="Share your constructive thoughts..." required></textarea>
            </div>
            <button type="submit" class="btn-primary">
              <span>Post Comment</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </form>
        </section>
      </article>
    </div>

    <!-- Related Articles Section -->
    <section style="background: var(--bg-card); border-top: 1px solid var(--border-color); padding: 4rem 0;">
      <div class="container">
        <div class="section-header">
          <h2 class="section-title">Related Stories</h2>
        </div>
        <div id="related-posts-grid" class="posts-grid">
          <!-- Rendered by post.js -->
        </div>
      </div>
    </section>
  </main>

  <!-- Scroll to Top Floating Button -->
  <button id="scroll-top-btn" class="scroll-top-btn" title="Back to top" aria-label="Back to top">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 Chronicle Journal Inc. All rights reserved.</p>
        <p><a href="index.html" style="color: var(--accent); font-weight: 500;">← Back to All Articles</a></p>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/posts-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/post.js"></script>
</body>
</html>
